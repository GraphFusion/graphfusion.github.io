name: Publish documentation

on:
  schedule:
    - cron: '0 1 * * *' # 09:00 Asia/Shanghai
  workflow_dispatch:
    inputs:
      source_ref:
        description: GraphFusion/GraphFusion branch or commit
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.source.outputs.changed }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check documentation source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref || 'main' }}
          EVENT: ${{ github.event_name }}
        run: |
          sha=$(gh api "repos/GraphFusion/GraphFusion/commits/$SOURCE_REF" --jq .sha)
          test -n "$sha"
          published=$(curl -fsSL --max-time 30 https://graphfusion.github.io/source-revision.txt || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ] || [ "$sha" != "$published" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://graphfusion.github.io/
    defaults:
      run:
        working-directory: source/website
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: GraphFusion/GraphFusion
          ref: ${{ needs.changes.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/website/package-lock.json
      - run: npm ci
      - name: Require root site configuration
        run: |
          node --input-type=module -e "import config from './astro.config.mjs'; if ((config.base ?? '/') !== '/') throw new Error('The production website must use the root (/) base path.');"
      - name: Install browser engine toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Install pinned WASM optimizer
        run: |
          binaryen_archive="$RUNNER_TEMP/binaryen-version_133-x86_64-linux.tar.gz"
          curl -fL --retry 3 https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz -o "$binaryen_archive"
          printf '2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  %s\n' "$binaryen_archive" | sha256sum --check
          tar -xzf "$binaryen_archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen*
            source/target
          key: pages-wasm-${{ runner.os }}-${{ hashFiles('source/Cargo.lock', 'source/rust-toolchain.toml') }}
      - name: Install version-matched browser bindings
        run: |
          if ! wasm-bindgen --version | grep -qx 'wasm-bindgen 0.2.128'; then
            cargo install wasm-bindgen-cli --version 0.2.128 --locked
          fi
      - run: npm run build:wasm
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-test-results
          path: source/website/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Record published source commit
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.sha }}
        run: printf '%s\n' "$SOURCE_SHA" > dist/source-revision.txt
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: source/website/dist
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
